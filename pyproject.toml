[project]
name = "chokepoint"
version = "0.3.1"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "colorama",
    "pyyaml",
    "pytmx",
    "pygamine",
]

[dependency-groups]
# Tooling for producing distributable builds (see chokepoint.spec / CI).
build = [
    "pyinstaller>=6.0",
    "pillow",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "coverage-badge>=1.1",
    "ruff==0.17.3",
    "pillow",
    "mypy==2.4.1",
    "types-pyyaml>=6.0.12.20261030",
    # Same version as `uvx codespell@...` in ci.yml's spelling job.
    "codespell==2.4.3",
]

[tool.ruff]
# ruff's own default, written out: both `ruff check` and `ruff format` use it.
line-length = 88
# The pygamine submodule has its own ruff configuration and CI.
extend-exclude = ["src/pygamine"]

[tool.ruff.format]
# Black-compatible formatting; Black's defaults throughout.
quote-style = "double"

[tool.ruff.lint]
# Deliberately narrow, like pygamine's: F (pyflakes -- real bugs such as
# unused imports or undefined names), not pycodestyle's style rules.
select = ["F"]

[tool.codespell]
# Typos plus British -> American spelling (issue #90: American English
# everywhere). Run: uv run --group dev codespell
builtin = "clear,rare,en-GB_to_en-US"
# .codespell-en-us.txt adds the British doubled-l forms the built-ins miss
# (traveled, relabeled, leveled, ... spelled with -ll-); "-" keeps the
# built-ins. "-" goes last: first, it would read as a command-line flag.
dictionary = "./.codespell-en-us.txt,-"
# .github too (hidden folders are skipped by default); .git and .venv aren't ours.
check-hidden = true
# Not ours or not text: the pygamine submodule (its own repo), third-party
# license texts, assets and binaries, the lock file, and local files
# (virtualenv, tool caches, saves, builds). Also the project dictionary
# itself (it lists British forms), the devlog entry on this decision, which
# shows the old British spellings as examples, and the Turkish language file
# (its words trip the English dictionaries).
skip = "./.codespell-en-us.txt,./config/lang/tr.yaml,./docs/devlog/2026-11-03-american-english.md,./.git,./.venv,.*_cache,__pycache__,./saves,./dist,./build,./htmlcov,./src/pygamine,./licenses,./assets,./uv.lock,./docs/devlog/img,*.png,*.gif,*.ico,*.ogg,*.mp3,*.wav,*.ttf,*.tmx,*.tsx,*.tiled-project"
# Real words codespell flags, one per line with why:
#   datas: PyInstaller's Analysis(datas=...) argument (chokepoint.spec, util/paths.py)
#   retuned: "re-tuned" (docs/decisions/0004-grid-targeting.md), not "returned"
ignore-words-list = "datas,retuned"

[tool.mypy]
# A lenient start (issue #37): the app's own code under src/, default
# (non-strict) checks, untyped functions skipped. Missing imports are
# errors, except for the stub-less third-party modules listed below. Tighten later, e.g. with
# check_untyped_defs or per-module strict overrides.
python_version = "3.12"
files = ["src"]
# src/pygamine first, so `pygamine` is the engine package, not its repo folder.
mypy_path = ["src/pygamine", "src"]
explicit_package_bases = true
# The pygamine submodule has its own CI; its types are used, its errors not reported.
exclude = ["^src/pygamine/"]

[[tool.mypy.overrides]]
# Third-party modules without type stubs or a py.typed marker.
module = ["pytmx", "pytmx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pygamine", "pygamine.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# Game's mixins use attributes and methods that Game itself defines, which
# mypy can't see from the mixin (attr-defined), nor the types of those it
# assigns (has-type). Typing them (a Protocol for `self`) is left for later.
module = ["app.game_events", "app.game_save"]
disable_error_code = ["attr-defined", "has-type"]

[tool.uv.sources]
pygamine = { path = "src/pygamine", editable = true }

[tool.pytest.ini_options]
# Puts src/ + src/pygamine on sys.path so tests can `import app.game` /
# `import gameplay.*` etc. without per-file path hacks (mirrors __main__.py).
pythonpath = ["src", "src/pygamine"]
testpaths = ["tests"]
# The default run skips tests marked slow (a quick local loop); CI runs
# everything with `-m ""`, which overrides this (the last -m wins).
addopts = '-m "not slow"'
markers = [
    "slow: whole simulated battles and script runs of 3+ seconds; skipped by default, run by CI",
]

[tool.coverage.run]
# pygamine is a vendored submodule with its own separate test suite
# (engine-tests in CI) -- the coverage badge should reflect only this app's
# own code. Listed as explicit leaf directories rather than "src" itself:
# coverage.py's static discovery of *unexecuted* files (needed so untested
# modules show as 0% instead of being silently excluded from the total)
# doesn't reliably recurse into subdirectories of a single top-level entry.
source = [
    "src/app",
    "src/domain",
    "src/gameplay",
    "src/gameplay/combat",
    "src/gameplay/towers",
    "src/ui",
    "src/util",
]
