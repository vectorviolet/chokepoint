# Where every file under assets/ comes from -- see README.md ("Asset sources").
# tests/test_sources.py keeps this complete, and scripts/gen_credits.py builds
# CREDITS.md's asset section from it. A source's license text is in
# licenses/assets/<source>.txt.
#
# source: a slug from `packs`, "own" (made for this game), or "unknown"
#         (origin not yet confirmed; then `todo` says what to do).
# original: the file's path inside that pack. modified: what was changed.

packs:
  font-anton:
    name: "Anton"
    author: "Vernon Adams"
    url: https://fonts.google.com/specimen/Anton
    license: OFL-1.1
    used_for: "display font"
  font-comic-neue:
    name: "Comic Neue"
    author: "Craig Rozynski"
    url: https://fonts.google.com/specimen/Comic+Neue
    license: OFL-1.1
    used_for: "text font"
  kenney-impact-sounds:
    name: "Impact Sounds"
    author: "Kenney"
    url: https://kenney.nl/assets/impact-sounds
    license: CC0-1.0
    used_for: "shot and hit sounds"
  kenney-mobile-controls:
    name: "Mobile Controls"
    author: "Kenney"
    url: https://kenney.nl/assets/mobile-controls
    license: CC0-1.0
    used_for: "HUD icons (play, pause, music, menu)"
  kenney-smoke-particles:
    name: "Smoke Particles"
    author: "Kenney"
    url: https://kenney.nl/assets/smoke-particles
    license: CC0-1.0
    used_for: "explosions, smoke"
  kenney-tower-defense-top-down:
    name: "Tower Defense (Top-Down)"
    author: "Kenney"
    url: https://kenney.nl/assets/tower-defense-top-down
    license: CC0-1.0
    used_for: "towers, enemies, projectiles, map tiles"
  kenney-ui-pack:
    name: "UI Pack"
    author: "Kenney"
    url: https://kenney.nl/assets/ui-pack
    license: CC0-1.0
    used_for: "buttons, menu sounds"
  laredgames-gems-coins:
    name: "Gems / Coins Free"
    author: "La Red Games"
    url: https://laredgames.itch.io/gems-coins-free
    license: CC0-1.0
    used_for: "coin animation"
  music-sakura-girl-clown:
    name: "Clown"
    author: "Sakura Girl"
    url: https://hypeddit.com/sakuragirl/clown
    license: CC-BY-3.0
    used_for: "menu and in-game music"

  kenney-board-game-icons:
    name: "Board Game Icons"
    author: "Kenney"
    url: https://kenney.nl/assets/board-game-icons
    license: CC0-1.0
    used_for: "sell button icon"
  kenney-platformer-art-deluxe:
    name: "Platformer Art Deluxe"
    author: "Kenney"
    url: https://kenney.nl/assets/platformer-art-deluxe
    license: CC0-1.0
    used_for: "lives heart (temporary)"

