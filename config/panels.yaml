# Labels the game always sets from code (the ON/OFF and window mode values, the pause
# menu's music button, the tower info labels, the plane upgrade, the language value)
# carry plain placeholder text here, not a text_key: Game and ui/*.py fill them from
# config/lang on every change. Everything else uses text_key (pygamine keeps those in
# step with the language itself).
groups:
  menu_chrome:
    logo:
      position: [CENTER, 60]
      size: [1085, 175]
      asset: logo

object_templates:
  btn-sm:
    size: [64, 64]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  btn-lg:
    size: [1000, 100]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  # Settings tab button: the open tab shows the yellow "active" look.
  settings_tab_button:
    size: [300, 70]
    asset: btn
    hover: btn_hover
    nine_slice: 10
    states:
      selected:
        asset: btn_active
        hover: btn_active
  music_toggle_icon:
    parent: music_toggle_button
    position: [CENTER, CENTER]
    size: [32, 32]
    asset: icon_music
    states:
      paused:
        asset: icon_music_disabled
  button_text:
    type: text
    font: anton
    font_size: 48
    position: [CENTER, CENTER]
  fee_text:
    type: text
    font: fira_sans
    font_size: 21
    color: green
    text: "0 $"
    background_color: [0, 0, 0, 100]
    padding: [6, 16]
  stat_text:
    type: text
    background_color: [ 50, 50, 50, 200 ]
    font: fira_sans_bold
    font_size: 31
    color: white
  # Tower info panel (game panel): title, a label column and a value column.
  tower_info_title:
    type: text
    font: fira_sans_bold
    font_size: 30
    color: white
  tower_info_label:
    type: text
    parent: tower_info_bg
    font: fira_sans
    font_size: 22  # Fira Sans runs wider than the old Comic Neue (was 25)
    color: [200, 200, 200]
  tower_info_value:
    type: text
    parent: tower_info_bg
    font: anton
    font_size: 24
    color: white
  # Buy button tooltip lines (game panel): sentences, so Fira Sans.
  buy_tooltip_line:
    type: text
    parent: buy_tooltip_bg
    font: fira_sans
    font_size: 25
    color: white
  # Credits screen: a small accent-colored heading per section, entries below.
  credits_heading:
    type: text
    font: fira_sans_bold
    font_size: 36
    color: [168, 224, 99]   # the logo's green
  credits_entry:
    type: text
    font: fira_sans
    font_size: 38
    color: white

panels:
  main_menu:
    extends: [menu_chrome]
    objects:
      main_menu_buttons:
        layout: { direction: vertical, start: [CENTER, 300], spacing: 120 }
        objects:
          play:     { extends: btn-lg }
          credits:  { extends: btn-lg }
          settings: { extends: btn-lg }
          exit:     { extends: btn-lg }

      play_text:
        extends: button_text
        parent: play
        text_key: "menu.play"
      credits_text:
        extends: button_text
        parent: credits
        text_key: "menu.credits"
      settings_text:
        extends: button_text
        parent: settings
        text_key: "menu.settings"
      exit_text:
        extends: button_text
        parent: exit
        text_key: "menu.exit"

      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

  play_menu:
    extends: [menu_chrome]
    objects:
      play_menu_title_text:
        type: text
        font: anton
        font_size: 70
        color: [168, 224, 99]
        position: [CENTER, 320]
        text_key: "menu.play"

      play_menu_buttons:
        layout: { direction: vertical, start: [CENTER, 460], spacing: 120 }
        objects:
          continue_game: { extends: btn-lg }
          new_game:      { extends: btn-lg }
          back:          { extends: btn-lg }

      new_game_text:
        extends: button_text
        parent: new_game
        text_key: "menu.new_game"
      continue_game_text:
        extends: button_text
        parent: continue_game
        text_key: "menu.continue"
      back_text:
        extends: button_text
        parent: back
        text_key: "common.back"

      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

  credits:
    extends: [menu_chrome]
    objects:
      credits_scroller:
        type: scrolling_panel
        position: [0, 200]   # visible viewport; content enters at its bottom
        size: [1920, 800]
        speed: 90            # px/s
        targets:
          - credits_lockup
          - credits_title
          - credits_dev_title
          - credits_dev
          - credits_art_title
          - credits_art
          - credits_ui_title
          - credits_ui
          - credits_ui_2
          - credits_sound_title
          - credits_sound
          - credits_vfx_title
          - credits_vfx
          - credits_music_title
          - credits_music
          - credits_music_2
          - credits_music_3
          - credits_fonts_title
          - credits_fonts
          - credits_fonts_2
          - credits_built_title
          - credits_built
          - credits_built_2
          - credits_github_icon
          - credits_github_name
          - credits_itch_icon
          - credits_itch_name

      # "a VECTORVIOLET game" -- pygamine's lockup; the file's built-in clear
      # space puts the visible logo at ~700x63 inside this 880x120 box.
      credits_lockup:
        position: [CENTER, 0]
        size: [880, 120]
        asset: vv_lockup
      credits_title:
        type: text
        font: anton
        font_size: 70
        position: [CENTER, 120]
        text_key: "credits.title"
        color: white
      credits_dev_title:
        extends: credits_heading
        position: [CENTER, 250]
        text_key: "credits.developer"
      credits_dev:
        extends: credits_entry
        position: [CENTER, 292]
        text: "Umutcan Ekinci"
      credits_art_title:
        extends: credits_heading
        position: [CENTER, 372]
        text_key: "credits.art"
      credits_art:
        extends: credits_entry
        position: [CENTER, 414]
        text: "Kenney - Tower Defense (Top-Down)"
      credits_ui_title:
        extends: credits_heading
        position: [CENTER, 494]
        text_key: "credits.ui"
      credits_ui:
        extends: credits_entry
        position: [CENTER, 536]
        text: "Kenney - UI Pack"
      credits_ui_2:
        extends: credits_entry
        position: [CENTER, 582]
        text: "La Red Games - Gems / Coins Free"
      credits_sound_title:
        extends: credits_heading
        position: [CENTER, 662]
        text_key: "credits.sound"
      credits_sound:
        extends: credits_entry
        position: [CENTER, 704]
        text: "Kenney - Impact Sounds"
      credits_vfx_title:
        extends: credits_heading
        position: [CENTER, 784]
        text_key: "credits.vfx"
      credits_vfx:
        extends: credits_entry
        position: [CENTER, 826]
        text: "Kenney - Smoke Particles"
      credits_music_title:
        extends: credits_heading
        position: [CENTER, 906]
        text_key: "credits.music"
      credits_music:
        extends: credits_entry
        position: [CENTER, 948]
        text: "Sakura Girl - Clown"
      credits_music_2:
        extends: credits_entry
        position: [CENTER, 994]
        text: "hypeddit.com/sakuragirl/clown"
      credits_music_3:
        extends: credits_entry
        position: [CENTER, 1040]
        text_key: "credits.license_cc_by"
      credits_fonts_title:
        extends: credits_heading
        position: [CENTER, 1120]
        text_key: "credits.fonts"
      credits_fonts:
        extends: credits_entry
        position: [CENTER, 1162]
        text: "Anton - Vernon Adams"
      credits_fonts_2:
        extends: credits_entry
        position: [CENTER, 1208]
        text: "Fira Sans - Mozilla, Telefonica"
      credits_built_title:
        extends: credits_heading
        position: [CENTER, 1288]
        text_key: "credits.built_with"
      credits_built:
        extends: credits_entry
        position: [CENTER, 1330]
        text: "pygame-ce"
      credits_built_2:
        extends: credits_entry
        position: [CENTER, 1376]
        text: "pygamine"
      # Profile links, closing the scroll a little apart from the sections:
      # platform icon + username, the pair centered as a row
      # (icons right-aligned at x=859, names start at x=873).
      credits_github_icon:
        position: [817, 1498]
        size: [42, 41]
        asset: github_icon
      credits_github_name:
        extends: credits_entry
        position: [873, 1496]
        text: "umutcanekinci"
      credits_itch_icon:
        position: [813, 1552]
