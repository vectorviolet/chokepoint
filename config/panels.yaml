groups:
  menu_chrome:
    logo:
      position: [CENTER, 60]
      size: [1085, 175]
      asset: logo

object_templates:
  btn-sm:
    size: [64, 64]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  btn-lg:
    size: [1000, 100]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  music_toggle_icon:
    parent: music_toggle_button
    position: [CENTER, CENTER]
    size: [32, 32]
    asset: icon_music
    states:
      paused:
        asset: icon_music_disabled
  button_text:
    type: text
    font: anton
    font_size: 48
    position: [CENTER, CENTER]
  fee_text:
    type: text
    font: comic_neue
    font_size: 21
    color: green
    text: "0 $"
    background_color: [0, 0, 0, 100]
    padding: [6, 16]
  stat_text:
    type: text
    background_color: [ 50, 50, 50, 200 ]
    font: comic_neue_bold
    font_size: 31
    color: white
  # Credits screen: a small accent-coloured heading per section, entries below.
  credits_heading:
    type: text
    font: comic_neue_bold
    font_size: 36
    color: [168, 224, 99]   # the logo's green
  credits_entry:
    type: text
    font: comic_neue
    font_size: 38
    color: white

panels:
  main_menu:
    extends: [menu_chrome]
    objects:
      main_menu_buttons:
        layout: { direction: vertical, start: [CENTER, 300], spacing: 120 }
        objects:
          play:     { extends: btn-lg }
          credits:  { extends: btn-lg }
          settings: { extends: btn-lg }
          exit:     { extends: btn-lg }

      play_text:
        extends: button_text
        parent: play
        text: "PLAY"
      credits_text:
        extends: button_text
        parent: credits
        text: "CREDITS"
      settings_text:
        extends: button_text
        parent: settings
        text: "SETTINGS"
      exit_text:
        extends: button_text
        parent: exit
        text: "EXIT"

      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

  play_menu:
    extends: [menu_chrome]
    objects:
      play_menu_title_text:
        type: text
        font: anton
        font_size: 70
        color: red
        position: [CENTER, 320]
        text: "PLAY"

      play_menu_buttons:
        layout: { direction: vertical, start: [CENTER, 460], spacing: 120 }
        objects:
          continue_game: { extends: btn-lg }
          new_game:      { extends: btn-lg }
          back:          { extends: btn-lg }

      new_game_text:
        extends: button_text
        parent: new_game
        text: "NEW GAME"
      continue_game_text:
        extends: button_text
        parent: continue_game
        text: "CONTINUE"
      back_text:
        extends: button_text
        parent: back
        text: "BACK"

      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

  credits:
    extends: [menu_chrome]
    objects:
      credits_scroller:
        type: scrolling_panel
        position: [0, 200]   # visible viewport; content enters at its bottom
        size: [1920, 800]
        speed: 90            # px/s
        targets:
          - credits_lockup
          - credits_title
          - credits_dev_title
          - credits_dev
          - credits_github_icon
          - credits_github_name
          - credits_itch_icon
          - credits_itch_name
          - credits_art_title
          - credits_art
          - credits_ui_title
          - credits_ui
          - credits_ui_2
          - credits_sound_title
          - credits_sound
          - credits_vfx_title
          - credits_vfx
          - credits_music_title
          - credits_music
          - credits_music_2
          - credits_fonts_title
          - credits_fonts
          - credits_fonts_2

      # "a VECTORVIOLET game" -- pygamine's lockup; the file's built-in clear
      # space puts the visible logo at ~700x63 inside this 880x120 box.
      credits_lockup:
        position: [CENTER, 0]
        size: [880, 120]
        asset: vv_lockup
      credits_title:
        type: text
        font: anton
        font_size: 70
        position: [CENTER, 120]
        text: "CREDITS"
        color: white
      credits_dev_title:
        extends: credits_heading
        position: [CENTER, 250]
        text: "Developer"
      credits_dev:
        extends: credits_entry
        position: [CENTER, 292]
        text: "Umutcan Ekinci"
      # Profile links: platform icon + username, the pair centred as a row
      # (icons right-aligned at x=859, names start at x=873).
      credits_github_icon:
        position: [817, 364]
        size: [42, 41]
        asset: github_icon
      credits_github_name:
        extends: credits_entry
        position: [873, 362]
        text: "umutcanekinci"
      credits_itch_icon:
        position: [813, 418]
        size: [46, 41]
        asset: itch_icon
      credits_itch_name:
        extends: credits_entry
        position: [873, 416]
        text: "umutcanekinci"
      credits_art_title:
        extends: credits_heading
        position: [CENTER, 500]
        text: "Art"
      credits_art:
        extends: credits_entry
        position: [CENTER, 542]
        text: "Kenney - Tower Defense (Top-Down)"
      credits_ui_title:
        extends: credits_heading
        position: [CENTER, 622]
        text: "UI"
      credits_ui:
        extends: credits_entry
        position: [CENTER, 664]
        text: "Kenney - UI Pack"
      credits_ui_2:
        extends: credits_entry
        position: [CENTER, 710]
        text: "La Red Games - Gems / Coins Free"
      credits_sound_title:
        extends: credits_heading
        position: [CENTER, 790]
        text: "Sound"
      credits_sound:
        extends: credits_entry
        position: [CENTER, 832]
        text: "Kenney - Impact Sounds"
      credits_vfx_title:
        extends: credits_heading
        position: [CENTER, 912]
        text: "VFX"
      credits_vfx:
        extends: credits_entry
        position: [CENTER, 954]
        text: "Kenney - Smoke Particles"
      credits_music_title:
        extends: credits_heading
        position: [CENTER, 1034]
        text: "Music"
      credits_music:
        extends: credits_entry
        position: [CENTER, 1076]
        text: "Sakura Girl - Clown"
      credits_music_2:
        extends: credits_entry
        position: [CENTER, 1122]
        text: "hypeddit.com/sakuragirl/clown"
      credits_fonts_title:
        extends: credits_heading
        position: [CENTER, 1202]
        text: "Fonts"
      credits_fonts:
        extends: credits_entry
        position: [CENTER, 1244]
        text: "Anton — Vernon Adams"
      credits_fonts_2:
        extends: credits_entry
        position: [CENTER, 1290]
        text: "Comic Neue — Craig Rozynski"

      back:
        extends: btn-sm
        size: [375, 100]
        position: [93, 840]
      back_text:
        extends: button_text
        parent: back
        text: "BACK"
      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

  settings:
    extends: [menu_chrome]
    objects:
      settings_title_text:
        type: text
        font: anton
        font_size: 70
        color: red
        position: [CENTER, 320]
        text: "SETTINGS"

      graphics_column:
        position: [160, 400]
        size: [700, 350]
      audio_column:
        position: [1060, 400]
        size: [700, 350]

      window_size_label_text:
        type: text
        font: comic_neue
        font_size: 28
        color: white
        parent: graphics_column
        position: [CENTER, 60]
        text: "WINDOW SIZE"

      window_size_back_button:
        extends: btn-sm
        parent: graphics_column
        position: [0, 120]
      window_size_back_button_text:
        extends: button_text
        parent: window_size_back_button
        text: "<"
      window_size_value_text:
        type: text
        font: comic_neue
        font_size: 37
        color: white
        background_color: [0, 0, 0, 100]
        padding: [8, 24]
        parent: graphics_column
        position: [CENTER, 112]
        text: "1920x1080"
      window_size_next_button:
        extends: btn-sm
        parent: graphics_column
        position: [636, 120]
      window_size_next_button_text:
        extends: button_text
        parent: window_size_next_button
        text: ">"

      window_mode_label_text:
        type: text
        font: comic_neue
        font_size: 28
        color: white
        parent: graphics_column
        position: [CENTER, 220]
        text: "WINDOW MODE"

      window_mode_back_button:
        extends: btn-sm
        parent: graphics_column
        position: [0, 280]
      window_mode_back_button_text:
        extends: button_text
        parent: window_mode_back_button
        text: "<"
      window_mode_value_text:
        type: text
        font: comic_neue
        font_size: 37
        color: white
        background_color: [0, 0, 0, 100]
        padding: [8, 24]
        parent: graphics_column
        position: [CENTER, 272]
        text: "FULLSCREEN"
      window_mode_next_button:
        extends: btn-sm
        parent: graphics_column
        position: [636, 280]
      window_mode_next_button_text:
        extends: button_text
        parent: window_mode_next_button
        text: ">"

      sfx_volume_label_text:
        type: text
        font: comic_neue
        font_size: 28
        color: white
        parent: audio_column
        position: [CENTER, 60]
        text: "SFX VOLUME"
      sfx_volume_value_text:
        type: text
        font: comic_neue
        font_size: 28
        color: white
        parent: audio_column
        position: [CENTER, 98]
        text: "100%"
      sfx_volume_slider:
        type: slider
        parent: audio_column
        position: [CENTER, 134]
        size: [440, 28]
        value: 1.0

      music_volume_label_text:
        type: text
        font: comic_neue
        font_size: 28
        color: white
        parent: audio_column
        position: [CENTER, 220]
        text: "BGM VOLUME"
      music_volume_value_text:
        type: text
        font: comic_neue
        font_size: 28
        color: white
        parent: audio_column
        position: [CENTER, 258]
        text: "100%"
      music_volume_slider:
        type: slider
        parent: audio_column
        position: [CENTER, 294]
        size: [440, 28]
        value: 1.0

      back:
        extends: btn-sm
        size: [375, 100]
        position: [93, 840]
      back_text:
        extends: button_text
        parent: back
        text: "BACK"
      reset:
        extends: btn-sm
        size: [375, 100]
        position: [493, 840]
      reset_text:
        extends: button_text
        parent: reset
        font_size: 36
        text: "RESET TO DEFAULT"
      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

  game:
    objects:
      level_text:
        extends: stat_text
        position: [15, 15]
        padding: [5, 10]
        text: "Level 1"
      live_text:
        extends: stat_text
        position: [15, 75]
        padding: [ 5, 10, 5, 50 ]
        text: "13"
      live_image:
        parent: live_text
        position: [10, CENTER]
        size: [ 32, 32 ]
        asset: heart
      coin_text:
        extends: stat_text
        position: [ 15, 135 ]
        padding: [ 5, 10, 5, 50 ]
        text: "0"
      coin_image:
        parent: coin_text
        type: animated
        position: [10, CENTER]
        size: [32, 32]
        asset: coin_sheet
        frame_count: 5
        fps: 8

      control_panel_bg:
        anchor: top-right
        position: [-15, 15]
        size: [120, 200]
      button_panel:
        parent: control_panel_bg
        layout: { direction: vertical, start: [CENTER, 0], spacing: 100 }
        objects:
          menu_button:          { extends: btn-sm, size: [60, 60] }
          start_pause_button:   { extends: btn-sm, size: [60, 60] }
          music_toggle_button:  { extends: btn-sm, size: [60, 60] }
          speed_toggle_button:
            extends: btn-sm
            size: [60, 60]
            states:
                x2_active:
                    asset: btn_active
                x4_active:
                    asset: btn_active_2
          upgrade_plane_button:
            extends: btn-sm
            size: [60, 60]
            states:
                purchased:
                    asset: btn_active

      menu_button_icon:
        parent: menu_button
        position: [CENTER, CENTER]
        size: [32, 32]
        asset: btn_menu
      start_pause_button_icon:
        parent: start_pause_button
        position: [CENTER, CENTER]
        size: [32, 32]
        asset: icon_play
        states:
          pause:
            asset: icon_pause
      music_toggle_icon:
        extends: music_toggle_icon
      speed_toggle_button_text:
        extends: button_text
        parent: speed_toggle_button
        font_size: 28
        text: "x1"
        states:
          x2_active: "x2"
          x4_active: "x4"
      upgrade_plane_button_text:
        extends: button_text
        parent: upgrade_plane_button
        font_size: 21
        text: "UPG PLANES"
        states:
          hover: "5K $"

      tower_panel_bg:
        anchor: bottom
        position: [0, -10]
        size: [650, 160]
        color: [50, 50, 50, 200]
      tower_buttons:
        parent: tower_panel_bg
        layout: { direction: horizontal, start: [30, 15], spacing: 170 }
        objects:
          buy_tower_1: { size: [96, 96], asset: buy_tower_1 }
          buy_tower_2: { size: [96, 96], asset: buy_tower_2 }
          buy_tower_3: { size: [96, 96], asset: buy_tower_3 }
          buy_tower_4:
            size: [96, 96]
            asset: buy_tower_4
            states:
              lvl2:
                asset: buy_tower_4_lvl2
      fee_texts:
        parent: tower_panel_bg
        layout: { direction: horizontal, start: [40, 120], spacing: 170 }
        objects:
          fee_text_1: { extends: fee_text }
          fee_text_2: { extends: fee_text }
          fee_text_3: { extends: fee_text }
          fee_text_4: { extends: fee_text }

      # Victory popup -- hidden by default (Game toggles .active on each of
      # these when wave 25 clears); declared last so it draws on top.
      victory_overlay:
        position: [0, 0]
        size: WINDOW
        color: [0, 0, 0, 170]
      victory_panel_bg:
        position: [CENTER, CENTER]
        size: [700, 620]
        asset: btn
        nine_slice: 10
      victory_title_text:
        type: text
        font: anton
        font_size: 56
        color: [255, 215, 0]
        parent: victory_panel_bg
        position: [CENTER, 70]
        text: "YOU WON!"
      victory_subtitle_text:
        type: text
        font: comic_neue
        font_size: 25
        color: white
        parent: victory_panel_bg
        position: [CENTER, 140]
        text: "Wave 25 cleared"

      victory_buttons:
        parent: victory_panel_bg
        layout: { direction: vertical, start: [CENTER, 220], spacing: 130 }
        objects:
          victory_continue:   { extends: btn-lg, size: [520, 90] }
          victory_play_again: { extends: btn-lg, size: [520, 90] }
          victory_main_menu:  { extends: btn-lg, size: [520, 90] }
      victory_continue_text:
        extends: button_text
        parent: victory_continue
        font_size: 30
        text: "CONTINUE (ENDLESS)"
      victory_play_again_text:
        extends: button_text
        parent: victory_play_again
        text: "PLAY AGAIN"
      victory_main_menu_text:
        extends: button_text
        parent: victory_main_menu
        text: "MAIN MENU"

      # Game over popup -- hidden by default (Game toggles .active on each of
      # these when lives hit 0); declared last so it draws on top.
      gameover_overlay:
        position: [0, 0]
        size: WINDOW
        color: [0, 0, 0, 170]
      gameover_panel_bg:
        position: [CENTER, CENTER]
        size: [700, 480]
        asset: btn
        nine_slice: 10
      gameover_title_text:
        type: text
        font: anton
        font_size: 56
        color: [220, 60, 60]
        parent: gameover_panel_bg
        position: [CENTER, 70]
        text: "GAME OVER"
      gameover_subtitle_text:
        type: text
        font: comic_neue
        font_size: 25
        color: white
        parent: gameover_panel_bg
        position: [CENTER, 140]
        text: "You ran out of lives"

      gameover_buttons:
        parent: gameover_panel_bg
        layout: { direction: vertical, start: [CENTER, 220], spacing: 130 }
        objects:
          gameover_play_again: { extends: btn-lg, size: [520, 90] }
          gameover_main_menu:  { extends: btn-lg, size: [520, 90] }
      gameover_play_again_text:
        extends: button_text
        parent: gameover_play_again
        text: "PLAY AGAIN"
      gameover_main_menu_text:
        extends: button_text
        parent: gameover_main_menu
        text: "MAIN MENU"
