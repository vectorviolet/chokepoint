      credits_itch_name:
        extends: credits_entry
        position: [873, 1550]
        text: "umutcanekinci"

      back:
        extends: btn-sm
        size: [375, 100]
        position: [93, 930]
      back_text:
        extends: button_text
        parent: back
        text_key: "common.back"
      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

  settings:
    extends: [menu_chrome]
    objects:
      settings_title_text:
        type: text
        font: anton
        font_size: 70
        color: [168, 224, 99]
        position: [CENTER, 320]
        text_key: "settings.title"

      # Tabs: a button per tab in the row below the title, and one group
