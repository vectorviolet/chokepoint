# Wave compositions — waves beyond the last entry are generated dynamically.
#
# Each entry is either:
#   <wave>: [{type, count}, ...]                              # list form, default spawn interval
#   <wave>: {spawn_interval: <ms>, groups: [{type, count}]}   # dict form, custom interval
# Default spawn_interval is WaveManager.SPAWN_INTERVAL_MS (1000).
#
# Design: enemy HP & kill_money scale +25% per wave. Waves 1-9 are gentle (a normal
# opening should not leak); from wave 11 the heavies, the first tank (wave 15), the
# first heavy tank (wave 22) and tighter spawn spacing make each wave ask for more
# defense than the last (see docs/devlog/2026-11-09-wave-balance.md).

waves:
  1:  [{type: 1, count: 6}]                                                       # tutorial: 1× Type-1 tower handles it
  2:  [{type: 1, count: 9}]                                                       # need 2nd tower or a Type-2
  3:  [{type: 1, count: 8},  {type: 2, count: 1}]                                 # first fast runner
  4:  [{type: 1, count: 9},  {type: 2, count: 1}]
  5:  [{type: 1, count: 7},  {type: 2, count: 2}]
  6:  [{type: 1, count: 9},  {type: 2, count: 2}]
  7:  [{type: 1, count: 7},  {type: 2, count: 3}, {type: 3, count: 1}]            # first bruiser — needs Type-3 or Type-2 L2
  8:  [{type: 1, count: 8},  {type: 2, count: 3}, {type: 3, count: 1}]
  9:  [{type: 1, count: 9},  {type: 2, count: 4}, {type: 3, count: 2}]
  10: [{type: 1, count: 6}, {type: 2, count: 5}, {type: 3, count: 3}]
  11: [{type: 1, count: 8}, {type: 2, count: 6}, {type: 3, count: 4}, {type: 4, count: 1}]
  12: [{type: 1, count: 8}, {type: 2, count: 7}, {type: 3, count: 5}, {type: 4, count: 2}]
  13: [{type: 1, count: 8}, {type: 2, count: 8}, {type: 3, count: 6}, {type: 4, count: 2}]
  14: [{type: 1, count: 8}, {type: 2, count: 9}, {type: 3, count: 7}, {type: 4, count: 3}]
  15: {spawn_interval: 600, groups: [{type: 1, count: 12}, {type: 2, count: 10}, {type: 3, count: 8}, {type: 4, count: 4}, {type: 5, count: 1}]}  # first tank
  16: [{type: 1, count: 6}, {type: 2, count: 10}, {type: 3, count: 8}, {type: 4, count: 4}, {type: 5, count: 1}]
  17: [{type: 1, count: 6}, {type: 2, count: 11}, {type: 3, count: 9}, {type: 4, count: 5}, {type: 5, count: 1}]
  18: [{type: 1, count: 6}, {type: 2, count: 12}, {type: 3, count: 10}, {type: 4, count: 5}, {type: 5, count: 2}]
  19: [{type: 1, count: 7}, {type: 2, count: 12}, {type: 3, count: 10}, {type: 4, count: 6}, {type: 5, count: 2}]
  20: {spawn_interval: 550, groups: [{type: 1, count: 10}, {type: 2, count: 14}, {type: 3, count: 11}, {type: 4, count: 8}, {type: 5, count: 3}]}
  21: [{type: 2, count: 14}, {type: 3, count: 11}, {type: 4, count: 8}, {type: 5, count: 3}]
  22: [{type: 2, count: 15}, {type: 3, count: 12}, {type: 4, count: 9}, {type: 5, count: 3}, {type: 6, count: 1}]  # first heavy tank
  23: [{type: 2, count: 15}, {type: 3, count: 12}, {type: 4, count: 9}, {type: 5, count: 4}, {type: 6, count: 1}]
  24: [{type: 2, count: 16}, {type: 3, count: 13}, {type: 4, count: 10}, {type: 5, count: 4}, {type: 6, count: 2}]
  25: {spawn_interval: 500, groups: [{type: 2, count: 18}, {type: 3, count: 14}, {type: 4, count: 10}, {type: 5, count: 5}, {type: 6, count: 2}]}
  26: [{type: 2, count: 8}, {type: 3, count: 6}, {type: 4, count: 4}, {type: 5, count: 1}]
  27: [{type: 2, count: 8}, {type: 3, count: 7}, {type: 4, count: 4}, {type: 5, count: 2}]
  28: [{type: 2, count: 9}, {type: 3, count: 7}, {type: 4, count: 5}, {type: 5, count: 2}, {type: 6, count: 1}]
  29: [{type: 2, count: 9}, {type: 3, count: 8}, {type: 4, count: 5}, {type: 5, count: 2}, {type: 6, count: 1}]
