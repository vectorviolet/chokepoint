window:
  size: [1920, 1080]
  fps: 165
  title: "Chokepoint"

gameplay:
  starting_money: 200
  starting_lives: 10
  auto_pause_between_waves: false  # the HUD's hourglass toggle; saved in settings
  keep_placing: false  # the HUD's keep-placing toggle (Shift); saved in settings
  skip_intro: false  # Settings > GAME: open straight to the main menu; saved in settings
  pause_on_focus_loss: true  # Settings > GAME: a battle pauses when the window loses focus; saved in settings
  keep_selection_while_buying: false  # Settings > GAME: picking a tower to buy keeps the selected tower and its range ring; saved in settings
  reduce_flashing: false  # Settings > DISPLAY: no white hit flash, dimmer explosions; saved in settings

camera:
  edge_scroll_zone: 30
  speed: 10
  zoom_step: 0.10
  zoom_min: 0.5
  zoom_max: 2.0

audio:
  master_volume: 1.0  # scales the music and every SFX
  music_volume: 1.0
  sfx_volume: 1.0