# English strings: every player-visible text of the game, addressed by
# dotted keys (pygamine's localization, ADR 0001 there). English is the
# fallback language. tr.yaml must have exactly the same keys and
# {placeholders}; tests/test_localization.py checks it, plus the fonts' glyphs.
# Logs, debug overlays and the balance tools stay English and are not here.
# Quote every value (a bare ON or 10 would not be a string).
_meta:
  name: "ENGLISH"  # shown on the Language row: written in capitals by hand

