# config/assets.yaml

images:
  # ── Backgrounds & general ─────────────────────────────────────────────
  logo:              {folder: branding, name: logo}
  # Logos shipped with pygamine (src/pygamine/pygamine/branding)
  vv_lockup:         {source: branding, folder: vectorviolet, name: lockup-dark-solid}  # for dark backgrounds (white artwork)
  github_icon:       {source: branding, folder: github, name: GitHub_Invertocat_White}
  itch_icon:         {source: branding, folder: itchio/logos, name: itchio-logo-textless-white}
  heart:             {folder: hud, name: heart}

  # ── Menu buttons (normal + hover pairs) ───────────────────────────────
  btn:               {folder: gui/Green/Default, name: button_rectangle_depth_flat}
  btn_hover:         {folder: gui/Grey/Default, name: button_rectangle_depth_flat}
  btn_active:        {folder: gui/Yellow/Default, name: button_rectangle_depth_flat}
  btn_active_2:      {folder: gui/Red/Default, name: button_rectangle_depth_flat}

  # ── In-game control buttons ───────────────────────────────────────────
  icon_play:         {folder: icons/Large, name: icon_play}
  icon_pause:         {folder: icons/Large, name: icon_pause}

  # ── Tower buy panel icons ─────────────────────────────────────────────
  buy_tower_1:       {folder: towers, name: buy_tower1}
  buy_tower_2:       {folder: towers, name: buy_tower2}
  buy_tower_3:       {folder: towers, name: buy_tower3}
  buy_tower_4:       {folder: towers, name: buy_tower4}
  tower_2_lvl2:      {folder: towers, name: tower2L2 }
  tower_2_lvl3:      {folder: towers, name: tower2L3 }
  tower_3_lvl2:      {folder: towers, name: tower3L2 }
  buy_tower_4_lvl2:  {folder: towers, name: tower4L2}

  # ── In-world tower sprites ────────────────────────────────────────────
  tower_1_lvl1:      {folder: towers, name: tower1L1}
  tower_2_lvl1:      {folder: towers, name: tower2L1}
  tower_3_lvl1:      {folder: towers, name: tower3L1}
  tower_4_lvl1:      {folder: towers, name: tower4L1}
  tower_4_lvl2:      {folder: towers, name: tower4L2}

  # ── Tower platforms (base under the rotating turret) ──────────────────
  tower_1_platform:  {folder: towers, name: tower1platform1}
  tower_2_platform:  {folder: towers, name: tower2platform1}
  tower_3_platform:  {folder: towers, name: tower3platform1}

  # ── Plane shadows ─────────────────────────────────────────────────────
  tower_4_shadow_lvl1: {folder: towers, name: tower4shadow1}
  tower_4_shadow_lvl2: {folder: towers, name: tower4shadow2}

  # ── Bullets / muzzle flashes ──────────────────────────────────────────
  muzzle_flash_1_lvl1: {folder: muzzle_flashes, name: 1L1}
  muzzle_flash_3_lvl1: {folder: muzzle_flashes, name: 3L1}
  muzzle_flash_3_lvl2: {folder: muzzle_flashes, name: 3L2}

  bullet_2_lvl1:     {folder: projectiles, name: 2L1}
  bullet_2_lvl2:     {folder: projectiles, name: 2L2}
  bullet_2_lvl3:     {folder: projectiles, name: 2L3}

  # ── Bomb explosion particles (planes drop bombs that explode) ─────────
  explosion_0:       {folder: particles/Explosion, name: explosion00}
  explosion_1:       {folder: particles/Explosion, name: explosion01}
  explosion_2:       {folder: particles/Explosion, name: explosion02}
  explosion_3:       {folder: particles/Explosion, name: explosion03}
  explosion_4:       {folder: particles/Explosion, name: explosion04}
  explosion_5:       {folder: particles/Explosion, name: explosion05}
  explosion_6:       {folder: particles/Explosion, name: explosion06}
  explosion_7:       {folder: particles/Explosion, name: explosion07}
  explosion_8:       {folder: particles/Explosion, name: explosion08}

  black_smoke_0:     {folder: "particles/Black smoke", name: blackSmoke00}
  black_smoke_1:     {folder: "particles/Black smoke", name: blackSmoke01}
  black_smoke_2:     {folder: "particles/Black smoke", name: blackSmoke02}
  black_smoke_3:     {folder: "particles/Black smoke", name: blackSmoke03}
  black_smoke_4:     {folder: "particles/Black smoke", name: blackSmoke04}
  black_smoke_5:     {folder: "particles/Black smoke", name: blackSmoke05}
  black_smoke_6:     {folder: "particles/Black smoke", name: blackSmoke06}
  black_smoke_7:     {folder: "particles/Black smoke", name: blackSmoke07}
  black_smoke_8:     {folder: "particles/Black smoke", name: blackSmoke08}
  black_smoke_9:     {folder: "particles/Black smoke", name: blackSmoke09}
  black_smoke_10:    {folder: "particles/Black smoke", name: blackSmoke10}
  black_smoke_11:    {folder: "particles/Black smoke", name: blackSmoke11}
  black_smoke_12:    {folder: "particles/Black smoke", name: blackSmoke12}


  # ── Enemy sprites ─────────────────────────────────────────────────────
  enemy_1:           {folder: enemies, name: E1}
  enemy_2:           {folder: enemies, name: E2}
  enemy_3:           {folder: enemies, name: E3}
  enemy_4:           {folder: enemies, name: E4}
  enemy_5:           {folder: enemies, name: E5}
  enemy_6:           {folder: enemies, name: E6}
  enemy_5_muzzle:    {folder: enemies, name: E5_Muzzle}
  enemy_6_muzzle:    {folder: enemies, name: E6_Muzzle}
  tank_bullet:       {folder: projectiles, name: Tank_Bullet}
  tank_muzzle_flash: {folder: muzzle_flashes, name: Tank_Muzzle_Effect}

  # ── Tile overlays (placement preview) ─────────────────────────────────
  tile_block:        {folder: tiles, name: block}
  tile_enable:       {folder: tiles, name: enable}

  btn_sell:    { folder: buttons, name: sell }
  btn_upgrade: { folder: icons/Large, name: icon_jump }
  btn_max:     { folder: buttons, name: max }
  btn_menu:    { folder: icons/Large, name: icon_menu}

  icon_music: { folder: icons/Large, name: icon_music }
  icon_music_disabled: { folder: icons/Large, name: icon_music_disabled }

  # ── Coin pickup (animated spritesheet, 4-frame horizontal strip) ──────
  coin_sheet:        {folder: coins, name: MonedaD}

# Bundled fonts (SIL OFL, licenses next to them) -- open lookalikes of Impact
# and Comic Sans MS, which can't be redistributed in release builds
fonts:
  anton:             {name: Anton-Regular}
  comic_neue:        {name: ComicNeue-Regular}
  comic_neue_bold:   {name: ComicNeue-Bold}

sounds:
  bg_music:          {folder: "", name: bg, extension: mp3}

  # ── Menu navigation SFX ───────────────────────────────────────────────
  switch_up:         {folder: "", name: switch-b}
  switch_down:       {folder: "", name: switch-a}
  click:             {folder: "", name: click-a}

  # ── Tower attack SFX (referenced by config/towers.yaml shoot_sound:) ──
  tower_1_shoot:     {folder: "", name: impactGeneric_light_000}
  tower_2_shoot:     {folder: "", name: impactMining_000}
  tower_3_shoot:     {folder: "", name: impactMetal_heavy_000}