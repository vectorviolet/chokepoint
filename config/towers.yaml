# Tower stats — all lists are per-level (index 0 = level 1, etc.)
# speeds = milliseconds between shots (LOWER = faster fire). Type 4 uses speeds as movement.
# shoot_sound = key into config/assets.yaml sounds; omit for silent towers (e.g. plane).
# name + tooltip = what the buy button's hover tooltip shows (ui/buy_tooltip.py):
#   the tower's name, then one line each for what it's good and bad at.
#
# Balance (2026-10-25, from headless whole-game simulations): gun-only,
# missile/cannon-only and mixed builds can all clear wave 25; the mixed
# build does best. Cost-efficiency (DPS per $): gun 0.20, missile L1 0.21,
# cannon L1 0.15 -- missile/cannon trade raw efficiency for range and HP.
#
# Range reference (tile = 64 px):
#   128 = 2.0 tiles   160 = 2.5 tiles   192 = 3.0 tiles
#   224 = 3.5 tiles   256 = 4.0 tiles   288 = 4.5 tiles

towers:
  - type: 1  # Rapid gun — cheap starter, low damage, short-medium range
    prices:      [100]      # was 80: at 80 spamming it beat every other build
    max_level:   1
    ranges:      [160]
    damages:     [12]
    speeds:      [600]      # DPS = 20.0
    hps:         [50]
    shoot_sound: tower_1_shoot
    name: Rapid gun
    tooltip:
      strength: Cheap and fires fast
      weakness: Short range, low damage, no upgrades

  - type: 2  # Homing missile — medium range, upgrades scale DPS up
    prices:      [160, 340, 600]
    max_level:   3
    ranges:      [192, 224, 256]
    damages:     [40, 70, 120]
    speeds:      [1200, 1000, 900]   # DPS = 33.3 / 70.0 / 133.3
    hps:         [80, 120, 180]
    shoot_sound: tower_2_shoot
    name: Homing missile
    tooltip:
      strength: Missiles home in; damage grows fast with upgrades
      weakness: Slow reload; full power needs costly upgrades

  - type: 3  # Heavy cannon — long range artillery, slow heavy hits
    prices:      [280, 560]
    max_level:   2
    ranges:      [256, 288]
    damages:     [90, 170]
    speeds:      [2200, 1800]        # DPS = 40.9 / 94.4
    hps:         [120, 200]
    shoot_sound: tower_3_shoot
    name: Heavy cannon
    tooltip:
      strength: Long range, heavy hits, sturdy
      weakness: Slowest to fire, and expensive

  - type: 4  # Plane — drops bombs along flight path; ranges = explosion radius
    # prices[1] is the one-time global upgrade making every later plane level 2.
    prices:    [600, 5000]
    max_level: 2
    ranges:    [96, 128]
    damages:   [100, 200]
    speeds:    [2, 1]
    # No hps: planes are not targetable by tanks and don't track HP.
    name: Plane
    tooltip:
      strength: Splash bombs along its flight; tanks can't hit it
      weakness: Flies once to the map's right edge, then it's gone
