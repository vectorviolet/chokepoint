name: Release

# Build per-OS bundles and publish them to a GitHub Release; the browser (pygbag)
# bundle is built and published by its own jobs (web, publish-web).
# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
# Use "Run workflow" (workflow_dispatch) to build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: chokepoint-windows.zip
          - os: macos-latest
            asset: chokepoint-macos.zip
          - os: ubuntu-latest
            asset: chokepoint-linux.zip
    steps:
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        # setup-uv publishes no floating major tag; pin an exact version.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies (incl. build group)
        run: uv sync --group build

      - name: Build bundle with PyInstaller
        env:
          # Headless build agents have no display/audio; keep SDL quiet.
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run pyinstaller chokepoint.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/chokepoint -DestinationPath ${{ matrix.asset }} -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto preserves the .app bundle's symlinks/permissions (zip can mangle them).
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Chokepoint.app" "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r "../${{ matrix.asset }}" chokepoint

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7  # the GitHub Release keeps the builds; artifacts only hand them to the release job

  # The browser build is independent of the desktop jobs: if pygbag fails (it
  # needs internet), the desktop release and its itch.io pushes still go out.
  web:
    name: Build web (pygbag)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      # Stages the bundle and runs the pinned pygbag (needs internet);
      # the result is build/web with index.html at its root.
      - name: Build web bundle with pygbag
        run: uv run python scripts/build_web.py

      - name: Package
        run: cd build/web && zip -r ../../chokepoint-web.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # Not "chokepoint-*": the desktop release jobs download that pattern.
          name: web-bundle
          path: chokepoint-web.zip
          if-no-files-found: error
          retention-days: 7  # the GitHub Release keeps the zip; the artifact only hands it to publish-web

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download the desktop build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: chokepoint-*
          path: artifacts
          merge-multiple: true

      - name: Create release and attach bundles
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-itch:
    name: Publish to itch.io
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download the desktop build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: chokepoint-*
          path: artifacts
          merge-multiple: true

      # butler diffs/patches at the file level, so unpack each zip rather than
      # pushing it as a single opaque file.
      - name: Unpack per-OS bundles
        run: |
          mkdir -p itch/windows itch/linux itch/osx
          unzip -q artifacts/chokepoint-windows.zip -d itch/windows
          unzip -q artifacts/chokepoint-linux.zip -d itch/linux
          unzip -q artifacts/chokepoint-macos.zip -d itch/osx

      - name: Push Windows build
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: umutcanekinci
          ITCH_GAME: chokepoint
          CHANNEL: windows
          VERSION: ${{ github.ref_name }}
          PACKAGE: itch/windows

      - name: Push Linux build
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: umutcanekinci
          ITCH_GAME: chokepoint
          CHANNEL: linux
          VERSION: ${{ github.ref_name }}
          PACKAGE: itch/linux

      - name: Push macOS build
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: umutcanekinci
          ITCH_GAME: chokepoint
          CHANNEL: osx
          VERSION: ${{ github.ref_name }}
          PACKAGE: itch/osx

  publish-web:
    name: Publish web build
    # After the desktop release exists, so the two never race to create it, and
    # only if the web build worked. A failure here never blocks the desktop jobs.
    needs: [web, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.web.result == 'success' && needs.release.result == 'success'
    steps:
      - name: Download the web build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: artifacts

      - name: Attach the web bundle to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/chokepoint-web.zip
          fail_on_unmatched_files: true

      # index.html sits at the zip's root, as itch.io expects; unpacked so
      # butler diffs at the file level.
      - name: Unpack web bundle
        run: |
          mkdir -p itch/web
          unzip -q artifacts/chokepoint-web.zip -d itch/web

      - name: Push web build
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: umutcanekinci
          ITCH_GAME: chokepoint
          CHANNEL: html5
          VERSION: ${{ github.ref_name }}
          PACKAGE: itch/web
