name: Wiki

# Mirrors the generated stats reference (docs/stats/, built by
# scripts/gen_stats.py) to the repo's GitHub wiki as Stats, Stats-Towers,
# Stats-Enemies and Stats-Waves, with their pictures in the wiki's images/
# folder (stats-*.png). Only those pages and pictures are written; every other
# wiki page (Home, ...) and image is left alone. The pages link their pictures
# as images/<file>, which is also the path in docs/stats/, so no link needs
# rewriting.
#
# Runs on pushes to main that change docs/stats/ or the generator (which
# alone decides the wiki page names, links and mirror note), and by hand (Run
# workflow; only from main, so unreviewed numbers never reach the wiki).
# Never on pull requests or merge-queue groups, so it is not and can't become
# a required check. Pages and pictures no longer generated are deleted from
# the wiki.
#
# The wiki must be enabled (Settings > General > Features > Wikis) and have
# its first page, created once in the web UI: until then the wiki has no git
# repository, and this job skips with a warning. Any other error reaching the
# wiki fails the job. After creating it, run this
# workflow once by hand to publish the current pages.
on:
  push:
    branches: [main]
    paths: ["docs/stats/**", "scripts/gen_stats.py"]
  workflow_dispatch:

permissions:
  contents: write  # GITHUB_TOKEN pushes to the wiki repository

# One publish at a time, in order; never cancel one mid-push.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the stats reference to the wiki
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The generator imports the game's code, which needs the pygamine submodule.
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build the wiki pages
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          uv run python scripts/gen_stats.py --check
          uv run python scripts/gen_stats.py --wiki "$RUNNER_TEMP/wiki-pages"

      - name: Push them to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          # Only "Repository not found" means the wiki isn't set up yet; any
          # other failure (permissions, network, server) fails the job.
          if ! err=$(git ls-remote "$url" 2>&1 > /dev/null); then
            if grep -q "Repository not found" <<< "$err"; then
              echo "::warning title=Wiki not set up::No wiki repository for ${GITHUB_REPOSITORY}. Enable the wiki, create its first page, then run this workflow by hand."
              exit 0
            fi
            echo "$err" >&2
            exit 1
          fi
          git clone --depth=1 "$url" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          # Drop the Stats pages and pictures the generator no longer makes,
          # then copy in the current ones.
          for page in Stats*.md images/stats-*.png; do
            [ -e "$page" ] || continue
            [ -e "$RUNNER_TEMP/wiki-pages/$page" ] || git rm -q -- "$page"
          done
          mkdir -p images
          cp "$RUNNER_TEMP"/wiki-pages/*.md .
          cp "$RUNNER_TEMP"/wiki-pages/images/*.png images/
          git add -- Stats*.md images/stats-*.png
          if git diff --cached --quiet; then
            echo "Wiki pages unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Update the stats reference from ${GITHUB_SHA::7}"
          git push origin HEAD
